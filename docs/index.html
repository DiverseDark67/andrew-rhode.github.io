---
layout: default
title: Andrew Rhode | Blog
---
<div class="main">
  <h1>Welcome to my blog</h1>
  <p>not sure how you got here but you found my blog. its pretty empty but it exists.</p>
  <div class="blog-item">
    {% for post in site.posts %}
    <div class="blog-container">
      <a class="blog-header" href="{{ post.url | relative_url }}">{{ post.title }}</a><div class="year">{{ post.date | date: "%-m/%-d/%Y" }}</div><div>{{ post.excerpt }}</div>
    </div>
    {% endfor %}
  </div>
</div>
